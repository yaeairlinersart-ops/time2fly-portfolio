<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">RadioEd 服务生态系统图</title>
  <desc id="desc">以学习者为中心，展示家庭、社区引导员、学习点、广播、纸质材料、课程伙伴、项目协调、教育部门及保护机构之间的关系。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#009edb"/></marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#005f87"/></marker>
    <symbol id="person" viewBox="0 0 64 64"><circle cx="32" cy="18" r="9"/><path d="M17 54V42c0-11 6-17 15-17s15 6 15 17v12M24 37h16"/></symbol>
    <symbol id="family" viewBox="0 0 64 64"><circle cx="21" cy="22" r="7"/><circle cx="43" cy="22" r="7"/><circle cx="32" cy="16" r="8"/><path d="M9 52v-9c0-9 5-14 12-14s12 5 12 14v9M31 52v-9c0-9 5-14 12-14s12 5 12 14v9M19 52V39c0-11 5-17 13-17s13 6 13 17v13"/></symbol>
    <symbol id="radio" viewBox="0 0 64 64"><path d="M15 21h36v30H15zM21 14l24-7M22 29h14M22 36h10"/><circle cx="43" cy="36" r="7"/><path d="M43 33v6M40 36h6"/></symbol>
    <symbol id="house" viewBox="0 0 64 64"><path d="M10 30 32 11l22 19v24H10zM24 54V38h16v16"/><circle cx="32" cy="29" r="5"/></symbol>
    <symbol id="book" viewBox="0 0 64 64"><path d="M9 15c13-4 21 0 23 6v34c-4-6-12-9-23-6zM55 15c-13-4-21 0-23 6v34c4-6 12-9 23-6z"/></symbol>
    <symbol id="paper" viewBox="0 0 64 64"><path d="M17 8h23l9 9v39H17zM40 8v10h9M24 28h18M24 36h18M24 44h13"/></symbol>
    <symbol id="building" viewBox="0 0 64 64"><path d="M9 54h46M14 49V25h36v24M10 25l22-14 22 14M21 31v12M32 31v12M43 31v12"/></symbol>
    <symbol id="shield" viewBox="0 0 64 64"><path d="M32 7 52 15v15c0 13-8 22-20 28-12-6-20-15-20-28V15Z"/><path d="m23 32 6 6 13-15"/></symbol>
    <style>
      text{font-family:Arial,"Microsoft YaHei",sans-serif}
      .ring{fill:none;stroke:#e4edf1;stroke-width:2}
      .relation{fill:none;stroke:#9fb8c4;stroke-width:2}
      .direct-line{fill:none;stroke:#009edb;stroke-width:3;marker-end:url(#arrow-blue)}
      .delivery-line{fill:none;stroke:#005f87;stroke-width:2.5;marker-end:url(#arrow-dark)}
      .boundary-line{fill:none;stroke:#91aab6;stroke-width:2;stroke-dasharray:7 7}
      .node-direct{fill:#009edb}
      .node-delivery{fill:#005f87}
      .node-boundary{fill:#e1e9ed}
      .icon-light{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .icon-dark{fill:none;stroke:#315f78;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .label{fill:#003b5c;font-size:20px;font-weight:700;text-anchor:middle}
      .sub{fill:#527b91;font-size:15px;text-anchor:middle}
      .axis{fill:#003b5c;font-size:25px;font-weight:700;letter-spacing:2px}
      .layer{fill:#527b91;font-size:14px;font-weight:700;letter-spacing:1.5px}
    </style>
  </defs>

  <rect width="1400" height="820" fill="#fff"/>
  <text x="70" y="62" fill="#003b5c" font-size="34" font-weight="700">RadioEd 服务生态系统</text>
  <text x="70" y="96" fill="#527b91" font-size="18">以学习者为中心：内容、社区支持与制度保障共同形成服务</text>

  <path class="ring" d="M470 655a230 230 0 0 1 460 0"/>
  <path class="ring" d="M325 655a375 375 0 0 1 750 0"/>
  <path class="ring" d="M175 655a525 525 0 0 1 1050 0"/>
  <text class="layer" x="1135" y="618">直接服务</text>
  <text class="layer" x="1150" y="445">交付伙伴</text>
  <text class="layer" x="1125" y="270">制度与保障</text>

  <path class="direct-line" d="M505 610 630 634"/>
  <path class="direct-line" d="M700 472 700 592"/>
  <path class="direct-line" d="M895 610 770 634"/>
  <path class="delivery-line" d="M472 355 650 603"/>
  <path class="delivery-line" d="M928 355 750 603"/>
  <path class="delivery-line" d="M620 236 500 330"/>
  <path class="delivery-line" d="M780 236 900 330"/>
  <path class="boundary-line" d="M700 150 700 200"/>
  <path class="boundary-line" d="M300 330 425 380"/>
  <path class="boundary-line" d="M1100 330 975 380"/>
  <path class="boundary-line" d="M1075 535 955 590"/>
  <path class="relation" d="M470 585 610 440"/>
  <path class="relation" d="M930 585 790 440"/>

  <g transform="translate(700 650)">
    <circle r="72" fill="#009edb"/>
    <use href="#person" x="-34" y="-42" width="68" height="68" class="icon-light"/>
    <text y="48" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">学习者</text>
  </g>

  <g transform="translate(455 590)"><circle r="58" class="node-direct"/><use href="#family" x="-30" y="-37" width="60" height="60" class="icon-light"/><text class="label" y="85">家庭与照护者</text><text class="sub" y="108">提醒 · 陪伴 · 居家支持</text></g>
  <g transform="translate(700 405)"><circle r="58" class="node-direct"/><use href="#person" x="-30" y="-37" width="60" height="60" class="icon-light"/><text class="label" y="85">社区引导员</text><text class="sub" y="108">解释 · 纠错 · 反馈</text></g>
  <g transform="translate(945 590)"><circle r="58" class="node-direct"/><use href="#house" x="-30" y="-36" width="60" height="60" class="icon-light"/><text class="label" y="85">社区学习点</text><text class="sub" y="108">共同收听 · 练习 · 求助</text></g>

  <g transform="translate(455 350)"><circle r="54" class="node-delivery"/><use href="#radio" x="-29" y="-29" width="58" height="58" class="icon-light"/><text class="label" y="80">广播与制作团队</text><text class="sub" y="102">录制 · 排期 · 重播</text></g>
  <g transform="translate(945 350)"><circle r="54" class="node-delivery"/><use href="#paper" x="-29" y="-30" width="58" height="58" class="icon-light"/><text class="label" y="80">印刷与物资团队</text><text class="sub" y="102">制作 · 配送 · 补充材料</text></g>
  <g transform="translate(620 225)"><circle r="50" class="node-delivery"/><use href="#book" x="-27" y="-28" width="54" height="54" class="icon-light"/><text class="label" y="76">教育与课程伙伴</text><text class="sub" y="98">目标 · 语言 · 内容审核</text></g>
  <g transform="translate(780 225)"><circle r="50" class="node-delivery"/><use href="#building" x="-27" y="-28" width="54" height="54" class="icon-light"/><text class="label" y="76">项目协调团队</text><text class="sub" y="98">资源 · 培训 · 运行协调</text></g>

  <g transform="translate(700 135)"><circle r="42" class="node-boundary"/><use href="#building" x="-23" y="-24" width="46" height="46" class="icon-dark"/><text class="label" y="66">当地教育部门</text><text class="sub" y="87">标准 · 许可 · 协调</text></g>
  <g transform="translate(280 315)"><circle r="42" class="node-boundary"/><use href="#family" x="-23" y="-24" width="46" height="46" class="icon-dark"/><text class="label" y="66">社区及宗教领袖</text><text class="sub" y="87">信任 · 宣传 · 参与动员</text></g>
  <g transform="translate(1120 315)"><circle r="42" class="node-boundary"/><use href="#shield" x="-23" y="-24" width="46" height="46" class="icon-dark"/><text class="label" y="66">学校与保护机构</text><text class="sub" y="87">专业支持 · 风险转介</text></g>
  <g transform="translate(1090 520)"><circle r="42" class="node-boundary"/><use href="#building" x="-23" y="-24" width="46" height="46" class="icon-dark"/><text class="label" y="66">资助与合作机构</text><text class="sub" y="87">资金 · 资源 · 监督</text></g>

  <line x1="70" y1="775" x2="105" y2="775" stroke="#009edb" stroke-width="8"/><text x="118" y="781" fill="#315f78" font-size="16">直接面向学习者</text>
  <line x1="315" y1="775" x2="350" y2="775" stroke="#005f87" stroke-width="8"/><text x="363" y="781" fill="#315f78" font-size="16">内容与资源交付</text>
  <line x1="575" y1="775" x2="610" y2="775" stroke="#a9bbc4" stroke-width="8"/><text x="623" y="781" fill="#315f78" font-size="16">制度保障与服务边界</text>
  <text x="1330" y="781" fill="#527b91" font-size="14" text-anchor="end">关系与职责仍需由当地合作方共同验证</text>
</svg>
